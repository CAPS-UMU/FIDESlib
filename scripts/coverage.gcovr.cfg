# gcovr configuration for FIDESlib host-code coverage.
#
# Used by scripts/run_coverage.sh and by any CI job that mirrors it. The report
# measures the library implementation (src/) and the public API (api/) only.
#
# NOTE: gcov instruments the host side of .cu files; device code
# (__device__/__global__ bodies) is not instrumented and shows as uncovered.
# Branch coverage is enabled by default in gcovr 8.x.

# Only measure library code and the public API. gcovr matches these regexes
# with re.match against paths relative to this config file's directory, so
# every pattern is prefixed with .* to match anywhere in the tree.
filter = .*src/
filter = .*api/

# Never measure tests, benchmarks, examples or third-party code.
exclude = .*test/
exclude = .*bench/
exclude = .*examples/
exclude = .*deps/
exclude = .*_deps/
exclude = .*nvtx/
exclude = .*commit/
exclude = .*build/
exclude = .*install/
# CMake compiler probes are compiled with the coverage flags but have no
# source on disk; skip them.
exclude = .*CompilerId.*
# nvcc host-compilation emits pseudo-sources (<built-in>/<command-line>)
# that gcov records but that have no real file on disk.
exclude = .*<built-in>
exclude = .*<command-line>
