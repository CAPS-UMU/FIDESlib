# Codecov configuration for FIDESlib.
#
# Coverage is generated by scripts/run_coverage.sh (gcovr, Cobertura XML) and
# uploaded with the Codecov CLI. The report only measures host-side code (src/
# and api/); CUDA device code is not instrumented by gcov, so percentages are
# expected to stay below what "real" coverage would be.

codecov:
  require_ci_to_pass: no

coverage:
  status:
    project:
      default:
        # "auto" tracks the previous commit's percentage, so PRs cannot lower
        # overall coverage. Change to a fixed number once a baseline is set.
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 5%

ignore:
  - "test/**"
  - "bench/**"
  - "examples/**"
  - "deps/**"
  - "_deps/**"
  - "cmake-build-*/**"
  - "build-*/**"
  - "nvtx/**"
